<!doctype html>
<html lang="my">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#059669" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <title>Home Accountant</title>
    <meta name="description" content="Home Accountant is a personal financial management web app designed to track household expenses and sync records to Google Drive." />
    <meta property="og:title" content="Home Accountant" />
    <meta property="og:description" content="Home Accountant is a personal financial management web app designed to track household expenses and sync records to Google Drive." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // In AI Studio environment, HMR WebSocket is disabled - ignore WebSocket errors per constraints
      window.addEventListener('error', function (event) {
        if (
          event.message &&
          (event.message.includes('WebSocket') || event.message.includes('@vite/client') || event.message.includes('websocket'))
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason && (event.reason.message || String(event.reason));
        if (reason && (reason.includes('WebSocket') || reason.includes('@vite/client') || reason.includes('websocket'))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
